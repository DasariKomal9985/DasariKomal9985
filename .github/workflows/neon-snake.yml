name: Generate Neon Green Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Neon Green Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DasariKomal9985
          outputs: |
            output/github-contribution-grid-snake-neon.svg
          color_snake: "#39FF14"
          color_dots: "#0aff9a"
          color_empty: "#1a1a1a"

      - name: Commit snake animation
        uses: EndBug/add-and-commit@v9
        with:
          add: "output/github-contribution-grid-snake-neon.svg"
          author_name: neon-bot
          author_email: neon@github.com
          message: "Neon Green Snake Updated"
