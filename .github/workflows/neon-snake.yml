name: Generate Neon Green Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DasariKomal9985
          outputs: |
            output/github-contribution-grid-snake-neon.svg
          color_snake: "#39FF14"
          color_dots: "#0aff9a"
          color_empty: "#1a1a1a"

      - name: Push Snake Output
        uses: EndBug/add-and-commit@v9
        with:
          add: "output/github-contribution-grid-snake-neon.svg"
          message: "Neon Snake Updated"
